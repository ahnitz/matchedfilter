name: CI

on:
  push:
    # ci/** branches prove a change to C or to the workflows before it reaches
    # main (docs/robustness-plan.md); ci/bench/** proves benchmark.yml, ci/nightly/**
    # nightly.yml and ci/release/** release.yml instead.
    branches: [ main, master, 'ci/**', '!ci/bench/**', '!ci/nightly/**', '!ci/release/**' ]
  pull_request:
  workflow_dispatch:

# Every run step is bash with pipefail: a failing command inside a pipe (`x | tee`)
# fails its step instead of passing as the pipe's last command. A diagnostic that
# may fail says so with a ::warning, never a bare `|| true`.
defaults:
  run:
    shell: bash

permissions:
  contents: read

# Single-threaded, as every test and benchmark here.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  test:
    # One suite per job. Python never reaches the C kernels, and MF_ISA restricts the
    # process to one Highway target (B3), so the targets are spread across the Python
    # versions instead of crossed with them: the forced SSE4 and AVX2 jobs, and the
    # widest target (AVX3 on an AVX-512 runner) on every Python. Each job's session
    # names its backend in a notice and fails if it is not the one asked for.
    name: test (${{ matrix.python }}, ${{ matrix.isa || 'widest' }}${{ matrix.sdist && ', sdist' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", isa: SSE4, numpy: "1.23.2"}     # the oldest Python, the numpy floor
          - {python: "3.11"}
          - {python: "3.12", sdist: true}
          - {python: "3.13"}
          - {python: "3.14"}
          - {python: "3.15", isa: AVX2}
          - {python: "3.15"}
    env:
      MF_ISA: ${{ matrix.isa }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }

      - name: Report the runner's CPU
        # Which back end runs depends on this: a widest job on a runner without
        # AVX-512 has not exercised AVX3.
        run: |
          grep -m1 'model name' /proc/cpuinfo
          for f in avx2 avx512f avx512vl; do
            echo "$f: $(grep -qm1 $f /proc/cpuinfo && echo yes || echo no)"
          done
          grep -qm1 avx512f /proc/cpuinfo || [ -n "$MF_ISA" ] \
            || echo "::notice title=CPU target::no AVX-512 on this runner: AVX3 not exercised here"

      - name: Install
        if: ${{ !matrix.sdist }}
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .[test] ${{ matrix.numpy && format('numpy=={0}', matrix.numpy) || '' }}

      - name: Build, check and install the source distribution
        # The sdist must carry every tracked file the build and the tests need: the
        # tracked files and the archive are compared, then the sdist is installed and
        # its own tests run (below) from outside the checkout.
        if: ${{ matrix.sdist }}
        run: |
          python -m pip install --upgrade pip build pytest pyflakes
          python -m build --sdist
          sd=$(ls dist/*.tar.gz)
          tar tzf "$sd" | sed 's|^[^/]*/||' | grep -v '/$' | sort > /tmp/sdist.txt
          git ls-files | sort > /tmp/tracked.txt
          # Not shipped on purpose: CI configuration, git metadata, the docs' data and
          # notes (the docs' Markdown ships), measurement JSON and prebuilt PTX under
          # tools/, and Highway's gitlink, whose sources are checked separately.
          comm -23 /tmp/tracked.txt /tmp/sdist.txt \
            | { grep -vE '^(\.github/|\.gitignore$|\.gitmodules$|notes/|third_party/highway$|tools/.*\.(json|ptx)$)' || true; } \
            | awk '!/^docs\// || /\.md$/' > /tmp/missing.txt
          grep -q 'third_party/highway/hwy/highway.h$' /tmp/sdist.txt \
            || echo "third_party/highway/hwy/highway.h (the vendored Highway)" >> /tmp/missing.txt
          if [ -s /tmp/missing.txt ]; then
            echo "::error::tracked files missing from the sdist: $(head -20 /tmp/missing.txt | tr '\n' ' ')"
            exit 1
          fi
          python -m pip install "$sd"

      - name: Test
        # From a scratch directory, so the tests import the installed package rather
        # than the source tree next to them; the sdist job runs the sdist's own tests,
        # which must be every test the checkout has.
        run: |
          if [ "${{ matrix.sdist }}" = "true" ]; then
            mkdir -p "$RUNNER_TEMP/sdist-check" && cd "$RUNNER_TEMP/sdist-check"
            tar xf "$GITHUB_WORKSPACE"/dist/*.tar.gz --strip-components=1
            count() { python -m pytest --collect-only -q tests | grep -oE '^[0-9]+ tests? collected'; }
            want=$(cd "$GITHUB_WORKSPACE" && count)
            have=$(count)
            echo "collected in the checkout: $want; in the sdist: $have"
            [ "$want" = "$have" ] || { echo "::error::the sdist's tests differ from the checkout's ($have vs $want)"; exit 1; }
            python -m pytest -q tests -rs --durations=15
          else
            mkdir -p /tmp/run && cd /tmp/run
            python -m pytest -q "$GITHUB_WORKSPACE/tests" -rs --durations=15
          fi

  test-arm:
    # Linux on arm64 (NEON, GCC): the build flags and the FP32 gate path differ from
    # the macOS wheel's, which is the only other ARM coverage.
    name: test (3.12, linux-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: lscpu | head -20
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .[test]
      - name: Test
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          python -m pytest -q "$GITHUB_WORKSPACE/tests" -rs --durations=15

  generated-files:
    # Generated CPU codelets are committed and must match their generator.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet numpy scipy

      - name: src/codelets-inl.h must match src/gen.py
        run: |
          cp src/codelets-inl.h /tmp/committed.h
          (cd src && python3 gen.py)
          diff -u /tmp/committed.h src/codelets-inl.h \
            || { echo "::error::src/codelets-inl.h is stale; re-run 'python3 src/gen.py'"; exit 1; }

      - name: src/codelets-q15-inl.h must match src/gen_q15.py
        run: |
          cp src/codelets-q15-inl.h /tmp/committed-q15.h
          (cd src && python3 gen_q15.py)
          diff -u /tmp/committed-q15.h src/codelets-q15-inl.h \
            || { echo "::error::src/codelets-q15-inl.h is stale; re-run 'python3 src/gen_q15.py'"; exit 1; }

  wheel:
    # The newest supported interpreter on both release platforms, smoke-tested: the
    # release builds every wheel with this same workflow and runs the full suite on each.
    uses: ./.github/workflows/wheels.yml
    with:
      select: cp315-manylinux_x86_64 cp315-macosx_arm64
      test: smoke

  metal:
    name: macOS GPU (Metal)
    # macos-latest: the paravirtual Metal device is reported working there,
    # and older images returned nil from MTLCreateSystemDefaultDevice.
    runs-on: macos-latest
    timeout-minutes: 45
    # GPU calibration-transfer checks are required: a missing device or a
    # numerical regression must not silently produce a green build.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The question this job exists to answer: does a hosted runner give
      # the guest a GPU at all? These are virtual machines, and a Metal
      # device is not guaranteed.
      #
      # Ask BOTH ways, and note which one matters. Compute needs no
      # display, but MTLCreateSystemDefaultDevice returns the device the
      # system recommends for RENDERING and is nil with nothing attached --
      # on macos-14 it returned NULL and system_profiler reported no display
      # at all. MTLCopyAllDevices is the enumeration, and it is the one that
      # answers "is there a GPU here".
      - name: Is there actually a GPU?
        run: |
          sw_vers
          xcrun -sdk macosx metal --version || echo "no Apple metal compiler"
          echo "--- displays ---"
          system_profiler SPDisplaysDataType 2>/dev/null | head -30 \
            || echo "::warning::system_profiler failed or was cut short"
          echo "--- Metal ---"
          python - <<'EOF'
          import ctypes
          objc = ctypes.CDLL("/usr/lib/libobjc.dylib")
          objc.sel_registerName.restype = ctypes.c_void_p
          objc.sel_registerName.argtypes = [ctypes.c_char_p]
          m = ctypes.CDLL("/System/Library/Frameworks/Metal.framework/Metal")
          m.MTLCreateSystemDefaultDevice.restype = ctypes.c_void_p
          d = m.MTLCreateSystemDefaultDevice()
          print("MTLCreateSystemDefaultDevice ->", hex(d) if d else "NULL")

          def name_of(dev):
              send = ctypes.cast(objc.objc_msgSend,
                                 ctypes.CFUNCTYPE(ctypes.c_void_p,
                                                  ctypes.c_void_p,
                                                  ctypes.c_void_p))
              ns = send(dev, objc.sel_registerName(b"name"))
              p = send(ns, objc.sel_registerName(b"UTF8String"))
              return ctypes.cast(p, ctypes.c_char_p).value.decode() if p else "?"

          if hasattr(m, "MTLCopyAllDevices"):
              m.MTLCopyAllDevices.restype = ctypes.c_void_p
              arr = m.MTLCopyAllDevices()
              cnt = 0
              if arr:
                  cf = ctypes.cast(objc.objc_msgSend,
                                   ctypes.CFUNCTYPE(ctypes.c_ulong,
                                                    ctypes.c_void_p,
                                                    ctypes.c_void_p))
                  cnt = cf(arr, objc.sel_registerName(b"count"))
              print("MTLCopyAllDevices -> %d device(s)" % cnt)
              at = ctypes.cast(objc.objc_msgSend,
                               ctypes.CFUNCTYPE(ctypes.c_void_p,
                                                ctypes.c_void_p,
                                                ctypes.c_void_p,
                                                ctypes.c_ulong))
              for i in range(cnt):
                  dev = at(arr, objc.sel_registerName(b"objectAtIndex:"), i)
                  print("   [%d] %s" % (i, name_of(dev)))
          else:
              print("MTLCopyAllDevices is not exported")
          if d:
              print("system default is:", name_of(d))
          EOF

      # The committed Metal sources, compiled by Apple's toolchain as the release does
      # (tools/precompile_metal.sh): what ships is what is tested. The .metallib files are
      # cached on the sources, the script and the compiler's version, so an unchanged
      # kernel set is not recompiled; test_kernels_ship's source hashes catch a committed
      # kernel that no longer matches its Slang.
      - name: Metal compiler version
        id: metalver
        run: echo "v=$(xcrun -sdk macosx metal --version | head -1 | tr -cd '[:alnum:]._-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: metallib
        with:
          path: python/matchedfilter/metal/*.metallib
          key: metallib-${{ steps.metalver.outputs.v }}-${{ hashFiles('python/matchedfilter/metal/*.metal', 'tools/precompile_metal.sh') }}
      - name: Compile the Metal kernels
        if: steps.metallib.outputs.cache-hit != 'true'
        run: tools/precompile_metal.sh
      - name: Stamp the Metal kernel identity
        # On a cache hit too: the identity hashes the .metallib bytes.
        run: python3 tools/kernel_build_id.py --backend metal

      - name: Install
        run: |
          python -m pip install -e . pytest
          python -c "
          import matchedfilter as mf
          for d in mf.devices():
              print(repr(d))
          from matchedfilter import _metal
          print('metal:', _metal.available())
          "

      # After the install, because it imports the package -- and with
      # always(), because the whole point of it is to explain a failure.
      # One process per kernel: a failed pipeline wedges this driver, and
      # checking them together turns one real failure into a cascade of
      # invented ones whose membership depends on filename order.
      - name: What can this device do?
        if: always()
        run: |
          # A diagnostic: the suite below is the gate. A kernel the probe
          # cannot run is named in a warning instead of hidden by the pipe.
          python tools/metal_probe.py || echo "::warning::metal_probe failed"
          for lib in python/matchedfilter/metal/*.metallib; do
            python tools/metal_probe.py "$lib" | tail -n +2 \
              || echo "::warning::metal_probe failed on $(basename "$lib")"
          done

      - name: Run the suite
        run: python -m pytest tests -q --require-coarse-gpu --tb=short

      # The end of the chain: does a shipped kernel actually run and give
      # the right answer? A failure here is the useful outcome -- it says
      # which link broke, and nothing on the development machine can.
      - name: Run a kernel on the GPU
        run: |
          python - <<'EOF'
          import numpy as np, matchedfilter as mf
          gpus = [d for d in mf.devices() if d.kind == "gpu"]
          if not gpus:
              # Say WHY, not just that. The library knows which question it
              # asked and what the answer was.
              from matchedfilter import _metal, _vulkan
              print("metal :", _metal.available()[1])
              print("vulkan:", _vulkan.available()[1])
              raise SystemExit("no GPU device was reported; nothing to run")
          n = 4096
          rng = np.random.default_rng(0)
          d = (rng.standard_normal((2, n)) + 1j*rng.standard_normal((2, n))).astype(np.complex64)
          h = (rng.standard_normal((3, n)) + 1j*rng.standard_normal((3, n))).astype(np.complex64)
          out = {}
          for dev in ("cpu", str(gpus[0])):
              f = mf.MatchedFilter(n, 2, 3, device=dev)
              f.set_data(d); f.set_templates(h)
              out[dev] = f.run(binsize=512, threshold=0.0).copy()
              print(dev, "ran")
          a, b = out["cpu"], out[str(gpus[0])]
          same = np.array_equal(a["index"], b["index"])
          err = np.max(np.abs(np.abs(a["value"]) - np.abs(b["value"])))
          print("indices match:", same, " max |value| difference:", err)
          assert same, "the Metal kernel disagreed with the CPU"
          EOF
