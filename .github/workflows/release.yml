name: Release

# Publishes to PyPI when a GitHub release is published, and can be run by hand
# against TestPyPI to rehearse without burning a version number. Every Monday it
# rehearses without uploading: every wheel built and tested, the set checked complete,
# the sdist built and tested, so a broken release is found before a tag needs it.
#
# Authentication is PyPI Trusted Publishing (OIDC): GitHub mints a short-lived
# token asserting this repo/workflow/environment, PyPI checks it against the
# publisher registered at
#   https://pypi.org/manage/account/publishing
# and returns a scoped upload token.  No API token is stored in this repo.
# The registration must name workflow "release.yml" and environment "pypi";
# changing either here means changing it there too.

on:
  release:
    types: [published]
  schedule:
    - cron: "41 4 * * 1"
  # A ci/release/** branch proves a change to this workflow or wheels.yml: the rehearsal,
  # on that commit (a push never publishes).
  push:
    branches: [ 'ci/release/**' ]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi, none]


# bash with pipefail in every run step.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  ci-green:
    # A release publishes only a commit whose CI run on main concluded success
    # (tools/ci_status.py: unknown and in-progress are not green; it waits up to an
    # hour for a run still going). 2026-10 history: a release went out from a red run.
    name: CI is green for this commit
    if: github.event_name != 'push'      # a proof branch is not published
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require a green CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_status.py --sha "$GITHUB_SHA" --workflow CI --wait 3600

  wheels:
    # pyproject's whole wheel list, one wheel per job, each with the full suite.
    uses: ./.github/workflows/wheels.yml
    with:
      metal: true
      artifact: dist-wheel

  complete:
    name: Every promised wheel is built
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-wheel-*
          path: dist
          merge-multiple: true
      - run: python3 tools/check_wheels.py dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The tag must match the version in pyproject.toml
        # The release is drafted by hand from a tag, so these can drift.  PyPI
        # publishes whatever the sdist says, and a version cannot be reused,
        # so catching it here is the only cheap moment.
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag  pyproject=$v"
          test "$v" = "$tag" || {
            echo "::error::tag $GITHUB_REF_NAME does not match version $v in pyproject.toml"
            exit 1
          }

      - run: pipx run build --sdist

      - name: The sdist must build and pass its own tests
        # An sdist missing a source file still installs on a machine that has a
        # stale build directory, so check it in a clean one.
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install dist/*.tar.gz
          mkdir -p /tmp/sdist-check && cd /tmp/sdist-check
          tar xf "$GITHUB_WORKSPACE"/dist/*.tar.gz --strip-components=1
          python -m pytest tests -q -rs

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [ci-green, complete, sdist]
    # Never on the weekly rehearsal, which uploads nothing.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target != 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write      # required to mint the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
