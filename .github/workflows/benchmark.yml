name: Benchmark

# Runs the benchmark on every platform the library claims to support and
# combines the results into one page.  The point is not the absolute numbers --
# shared runners are noisy -- but the comparison across back ends: AVX-512,
# AVX2, and the compiler-vectorised portable path on x86, arm64 and macOS.

on:
  push:
    branches: [ main, portable, 'ci/bench/**' ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"     # Monday, so drift in the runner fleet is visible

# bash with pipefail: a benchmark that crashes inside `| tee` fails its own step.
# (Until 2026-10-21 the pipe hid such a crash, and the run failed later, at the
# upload of a result that was never written.)
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.label }}
    # On push, only a ci/bench/** branch (a proof of this workflow) benchmarks.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/ci/bench/')
    runs-on: ${{ matrix.os }}
    # A job that never gets a runner would otherwise sit for hours and block
    # the page build behind it. The hierarchical table calibrates and trials
    # fifteen (budget, SNR) cells per length, about 30 s a cell at n = 65536
    # on a Zen 5 desktop; on every length of the flat sweep it ran past the
    # 2-hour limit on 2026-10-22, so it runs at two (--hier-n below). The
    # flat table takes seconds at every length.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target this build holds is benchmarked within ONE job.
          # Each matrix entry is a separate runner VM with its own CPU model
          # and its own neighbours, so comparing targets across entries would
          # compare machines as much as kernels.
          - {os: ubuntu-24.04,     label: "linux-x86_64"}
          - {os: ubuntu-24.04-arm, label: "linux-arm64"}
          - {os: macos-14,         label: "macos-arm64"}
          # Intel macOS is deliberately absent: the hosted fleet is retiring
          # those runners, and a platform that cannot be tested should not be
          # claimed.  It may well work -- it is the x86 kernels plus Clang --
          # but nothing here measures that.
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Record what this runner actually is
        run: |
          python -c "import platform;print(platform.platform(), platform.machine())"
          if [ -r /proc/cpuinfo ]; then
            grep -m1 'model name' /proc/cpuinfo || echo "::warning::no model name in /proc/cpuinfo"
            for f in avx2 avx512f avx512vl neon asimd; do
              echo "$f: $(grep -qm1 $f /proc/cpuinfo && echo yes || echo no)"
            done
          else
            sysctl -n machdep.cpu.brand_string 2>/dev/null || echo "::warning::no CPU brand string"
            sysctl -n hw.optional.avx2_0 2>/dev/null || echo "hw.optional.avx2_0: not reported"
          fi
          cc --version | head -1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]
          # FFTW is the reference worth comparing against, but pyfftw has no
          # wheel on every platform here.  Optional by design: the benchmark
          # reports whichever references it finds.
          python -m pip install pyfftw || \
            echo "::notice::FFTW unavailable; timings will use MKL if installed"
          # MKL is x86-only and has no arm64 or macOS wheel, so this is
          # expected to fail on two of the three runners.
          python -m pip install mkl mkl-fft || \
            echo "::notice::MKL unavailable on this platform (expected off x86)"

      - name: Test and benchmark every target on this host
        # The suite coarse thresholds the benchmark: a timing of a wrong answer is
        # worthless, and a kernel has produced wrong answers before.
        #
        # Time automatic selection plus AVX2 when distinct. The separate
        # correctness workflow still exercises every supported SIMD target.
        run: |
          # Single-threaded is the claim, so pin the references too: an
          # FFTW or MKL that quietly used every core would be comparing
          # core counts rather than transforms.
          export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          mkdir -p /tmp/run && cd /tmp/run
          targets=$(python -m matchedfilter.benchmark --list-targets)
          echo "targets on this host: $targets"
          for isa in $targets; do
            if [ "$isa" = auto ]; then unset MF_ISA; name="${{ matrix.label }}"
            else export MF_ISA="$isa"; name="${{ matrix.label }}-$isa"; fi
            echo "::group::$name"
            python -m pytest -q "$GITHUB_WORKSPACE/tests/test_api.py" \
              "$GITHUB_WORKSPACE/tests/test_output_order.py" \
              "$GITHUB_WORKSPACE/tests/test_precision.py" \
              "$GITHUB_WORKSPACE/tests/test_benchmark.py" -rs
            python -m matchedfilter.benchmark \
              --n 256 1024 4096 16384 65536 262144 1048576 \
              --hier-n 1024 16384 \
              --reps 7 --fd 1e-3 \
              --label "$name" \
              --json "$GITHUB_WORKSPACE/bench-$name.json" \
              | tee "$GITHUB_WORKSPACE/bench-$name.txt"
            echo "::endgroup::"
          done

      - name: Measure automatic overlap-save workloads
        run: |
          export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          python tools/bench_series_workloads.py --quick --reps 5 \
            --json "series-${{ matrix.label }}.json" \
            | tee "series-${{ matrix.label }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: series-${{ matrix.label }}
          path: series-${{ matrix.label }}.json
          if-no-files-found: error

      - name: Publish to the run summary
        if: always()
        run: |
          for f in bench-${{ matrix.label }}*.txt; do
            [ -e "$f" ] || continue
            { echo "## $(basename "$f" .txt | sed 's/^bench-//')"; echo
              echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          for f in series-${{ matrix.label }}*.txt; do
            [ -e "$f" ] || continue
            { echo "## $(basename "$f" .txt)"; echo
              echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.label }}
          path: bench-${{ matrix.label }}*.json
          if-no-files-found: error

  bench-metal:
    # The Metal benchmark and scoreboard, moved here from CI's Metal job, where
    # they ran on every push for 14 min under `|| true`. Advisory numbers, but a
    # crash now fails this job.
    name: macos-metal
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/ci/bench/')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Compile the committed Metal kernels
        run: |
          python -m pip install -U pip numpy
          tools/precompile_metal.sh
      - name: Install
        run: python -m pip install -e . pytest
      - name: Benchmark and scoreboard
        run: |
          export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1
          python -m matchedfilter.benchmark --n 1024 4096 16384 65536 \
            --data 8 --templates 16 --reps 3 --fftw-plan measure | tee bench-metal.txt
          python tools/scoreboard.py --pairs 128 | tee -a bench-metal.txt
      - name: Publish to the run summary
        if: always()
        run: |
          [ -e bench-metal.txt ] || exit 0
          { echo "## macos-metal"; echo; echo '```'; cat bench-metal.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  page:
    name: Build the documentation page
    needs: bench
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read          # configure-pages reads the repository's Pages settings
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # third_party/highway
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: bench-*, path: results, merge-multiple: true }

      - name: Install the library, so the demo page can run it
        # The "See it work" page executes the library while the page is being
        # built and plots what comes back. Without the package installed it
        # has nothing to run, and a documentation page whose whole claim is
        # that its figures are generated rather than cached should not
        # quietly publish saying so.
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Build documentation site
        run: |
          mkdir -p results
          # If fresh runner benchmarks were produced, include them; otherwise use committed fleet benchmarks
          inputs=()
          if ls results/*.json 1> /dev/null 2>&1; then
            inputs+=(results/*.json)
          fi
          if ls docs/measurements/bench/*.json 1> /dev/null 2>&1; then
            inputs+=(docs/measurements/bench/*.json)
          fi
          if [ ${#inputs[@]} -eq 0 ]; then
            inputs+=(docs/measurements/authenticamd-*.json docs/measurements/genuineintel-*.json)
          fi
          python tools/build_report.py "${inputs[@]}" --root . --require-demo \
                 --out site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-page
          path: site/

      # Published only from the default branch: a page rebuilt from a PR's
      # numbers would overwrite the reference results with one-off ones.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with: { path: site/ }

  deploy:
    name: Publish
    needs: page
    # always(): the bench job is skipped on ordinary pushes, and a skipped job up
    # the chain skips every dependant unless its condition says otherwise.
    if: always() && !cancelled() && needs.page.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
