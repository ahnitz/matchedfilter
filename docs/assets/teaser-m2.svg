  <g id="text_31">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e8eef7" x="34.56" y="20.88" transform="rotate(-0 34.56 20.88)">8,192 correlations × 4,096 points</text>
  </g>
  <g id="text_32">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #adb9ca" x="34.56" y="41.76" transform="rotate(-0 34.56 41.76)">Throughput · higher is better · CPU and GPU use different scales</text>
  </g>
  <g id="text_33">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #adb9ca" x="34.56" y="61.8048" transform="rotate(-0 34.56 61.8048)">Same matched-profile bank and Gaussian noise · SNR 5.5 · full lag window</text>
  </g>
  <g id="text_34">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #adb9ca" x="34.56" y="354.96" transform="rotate(-0 34.56 354.96)">Each step restricts the result: all lags → one peak per pair → a screened subset. Hierarchical FDR is requested, not measured here.</text>
  </g>
  <g id="text_35">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #adb9ca" x="34.56" y="373.752" transform="rotate(-0 34.56 373.752)">FFTW / MLX: inverse FFT only. Full: product + inverse FFT + all lags. Peak: product + inverse FFT + maximum.</text>
  </g>
  <g id="text_36">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #adb9ca" x="34.56" y="392.544" transform="rotate(-0 34.56 392.544)">Setup excluded; FFTW PATIENT planning capped at 15 s. Full output reuses caller storage; GPU timing includes synchronization.</text>
